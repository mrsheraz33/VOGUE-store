<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Vouge Storee | Fashion & Lifestyle</title>

    <meta
      name="description"
      content="Shop the latest fashion and lifestyle products at Vougee Store. Discover quality products, stylish collections, and great deals online."
    />

    <meta
      name="keywords"
      content="Vougee Store, fashion store, online shopping, fashion, clothing, lifestyle products, online store"
    />

    <meta name="author" content="Vougee Store" />

    <!-- Search Engine Crawling -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.vougee.store/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.vougee.store/" />
    <meta property="og:title" content="Vougee Store | Fashion & Lifestyle" />
    <meta
      property="og:description"
      content="Discover the latest fashion and lifestyle products at Vougee Store."
    />
    <meta
      property="og:image"
      content="https://www.vougee.store/favicon.jpeg"
    />
    <meta property="og:site_name" content="Vougee Store" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vougee Store | Fashion & Lifestyle"
    />
    <meta
      name="twitter:description"
      content="Discover the latest fashion and lifestyle products at Vougee Store."
    />
    <meta
      name="twitter:image"
      content="https://www.vougee.store/favicon.jpeg"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
